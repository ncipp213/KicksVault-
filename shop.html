<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Shop — KicksVault</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <!-- Header Section -->
        <header class="site-header">
        <nav class="nav">
            <a class="logo" href="index.html">
            <span class="logo-mark">K</span>KICK<span class="lime">S</span>VAULT
            </a>
            <div class="nav-links">
            <a href="index.html">Home</a>
            <a class="active" href="shop.html">Shop</a>
            <a href="about.html">The Vault</a>
            <a href="contact.html">Contact</a>
            </div>
            <div class="actions">

            <button class="menu-btn" data-menu>☰</button>

        <main class="pad">

        <div class="filters">
            <button class="filter active" data-filter="All">All</button>

            <button class="filter" data-filter="Women">Women</button>
            <button class="filter" data-filter="Kids">Kids</button>

            <button class="filter" data-filter="Running">Running</button>
            <button class="filter" data-filter="Formal">Formal</button>

        <section class="product-grid catalog" data-catalog></section>
        </main>

        <!-- Footer Section -->
        <footer class="footer">
        <div class="footer-top">
            <a class="logo" href="index.html">
            <span class="logo-mark">K</span>KICK<span class="lime">S</span>VAULT

        <div class="footer-bottom">
            <span>© 2026 KicksVault / Salatiga</span>
